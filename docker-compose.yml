# Docker Compose Configuration for Full Stack Application
# Frontend (React/Vite) + Backend (Express/Node.js) + Database (PostgreSQL)
#
# Basic Commands:
# 
# Build and start all services:
# docker compose up --build
#
# Start services in background:
# docker compose up -d
#
# Stop all services:
# docker compose down
#
# Stop and remove volumes:
# docker compose down -v
#
# Build specific service:
# docker compose build backend
# docker compose build frontend
#
# View running services:
# docker compose ps
#
# View logs:
# docker compose logs -f
#
# Access points:
# Frontend: http://localhost:${FRONTEND_EXPOSED_PORT}
# Backend API: http://localhost:${BACKEND_EXPOSED_PORT}
# Database: localhost:${DB_EXPOSED_PORT}
#
# Note: Docker Compose automatically loads .env file for variable substitution
# Copy .env.example to .env or create .env with required variables

services:
  # PostgreSQL Database
  database:
    image: postgres:18.6
    env_file:
      - .env
    ports:
      - "${DB_EXPOSED_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build: .
    command: npm run dev:api
    env_file:
      - .env
    ports:
      - "${BACKEND_EXPOSED_PORT}:${PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DB_HOST=database
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=1000
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${PORT}/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Frontend
  frontend:
    build: .
    command: npm run dev:web
    env_file:
      - .env
    ports:
      - "${FRONTEND_EXPOSED_PORT}:${FRONTEND_PORT}"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - API_PROXY_TARGET=http://backend:3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# Named volumes for data persistence
volumes:
  postgres_data: